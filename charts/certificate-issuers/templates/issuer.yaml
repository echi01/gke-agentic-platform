apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuerName }}
spec:
  acme:
    email: {{ required "Set the certificate contact email" .Values.email | quote }}
    server: {{ .Values.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuerName }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClassName }}
            serviceType: ClusterIP
            podTemplate:
              metadata:
                annotations:
                  sidecar.istio.io/inject: "false"
