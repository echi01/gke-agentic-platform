{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" .Values.image) }}
{{- fail "Select an approved model runtime image by digest" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-inference
spec:
  serviceName: agent-inference
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app: agent-inference}
  template:
    metadata:
      labels: {app: agent-inference}
    spec:
      serviceAccountName: inference
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      {{- if .Values.gpu }}
      nodeSelector: {workload-class: gpu}
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      {{- end }}
      containers:
        - name: model
          image: {{ .Values.image | quote }}
          command: {{ .Values.command | toJson }}
          ports: [{name: http, containerPort: {{ .Values.port }}}]
          env: [{name: OLLAMA_HOST, value: '0.0.0.0:11434'}, {name: OLLAMA_MODELS, value: /models}, {name: HOME, value: /tmp}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 120}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          resources:
            requests:
              {{- toYaml .Values.resources.requests | nindent 14 }}
              {{- if .Values.gpu }}
              nvidia.com/gpu: "1"
              {{- end }}
            limits:
              {{- toYaml .Values.resources.limits | nindent 14 }}
              {{- if .Values.gpu }}
              nvidia.com/gpu: "1"
              {{- end }}
          volumeMounts: [{name: models, mountPath: /models}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
  volumeClaimTemplates:
    - metadata: {name: models}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.modelStorageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-inference
spec:
  type: ClusterIP
  selector: {app: agent-inference}
  ports: [{name: http, port: {{ .Values.port }}, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-isolation
spec:
  podSelector: {matchLabels: {app: agent-inference}}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- range .Values.allowedClients }}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .namespace }}}}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports: [{protocol: TCP, port: {{ $.Values.port }}}]
    {{- else }}
    []
    {{- end }}
  # Models are preloaded deliberately; no runtime internet/download authority.
  egress: []
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-inference
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: StatefulSet, name: agent-inference}
  minReplicas: {{ .Values.replicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
{{- end }}
