{{- if and (not .Values.localDevelopment) (not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" .Values.image)) }}
{{- fail "Select the scanned platform MCP image by digest" }}
{{- end }}
{{- if and (not .Values.localDevelopment) (empty .Values.apiCidrs) }}
{{- fail "Set exact Kubernetes Service and private endpoint /32 CIDRs" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-options: Prune=false}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: platform-mcp}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: platform-assistant}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: platform-inspector, namespace: {{ .Values.inspectNamespace }}}
rules:
  - {apiGroups: [''], resources: [pods, events], verbs: [get, list]}
  - {apiGroups: [apps], resources: [deployments], verbs: [get, list]}
  - {apiGroups: [batch], resources: [jobs], verbs: [get, list]}
  - {apiGroups: [autoscaling], resources: [horizontalpodautoscalers], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: platform-inspector, namespace: {{ .Values.inspectNamespace }}}
subjects:
  - {kind: ServiceAccount, name: platform-mcp, namespace: {{ .Release.Namespace }}}
  - {kind: ServiceAccount, name: platform-assistant, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-inspector}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: connect-platform-mcp}
rules:
  - {apiGroups: [''], resources: [pods], resourceNames: [platform-mcp-0], verbs: [get]}
  - {apiGroups: [''], resources: [pods/exec], resourceNames: [platform-mcp-0], verbs: [create]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: connect-platform-mcp}
subjects:
  - {kind: ServiceAccount, name: platform-assistant, namespace: {{ .Release.Namespace }}}
  {{- range .Values.operatorGroups }}
  - {kind: Group, name: {{ . | quote }}, apiGroup: rbac.authorization.k8s.io}
  {{- end }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: connect-platform-mcp}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: platform-mcp}
spec:
  serviceName: platform-mcp
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: platform-mcp}}
  template:
    metadata: {labels: {app.kubernetes.io/name: platform-mcp}}
    spec:
      serviceAccountName: platform-mcp
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mcp
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env: [{name: INSPECT_NAMESPACE, value: {{ .Values.inspectNamespace | quote }}}]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: {exec: {command: [python, -c, "import os; assert os.path.exists('/mcp/server.py')"]}, periodSeconds: 15}
          livenessProbe: {exec: {command: [python, -c, "import os; assert os.path.exists('/proc/1')"]}, periodSeconds: 30}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-ops-default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: platform-mcp-api}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: platform-mcp}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range .Values.apiCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
    {{- end }}
