{{- if not (regexMatch "^[a-f0-9]{40}$" .Values.revision) }}{{ fail "Pin the infrastructure Git commit" }}{{ end }}
{{- range $name,$addon := .Values.addons }}
{{- if $addon }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: {{ $addon.wave | quote }}}
spec:
  project: platform
  source:
    repoURL: {{ $.Values.repositoryUrl | quote }}
    targetRevision: {{ $.Values.revision | quote }}
    path: {{ $addon.path | quote }}
    helm:
      releaseName: {{ $addon.name | quote }}
      valuesObject:
        {{- toYaml $addon.values | nindent 8 }}
  destination: {server: 'https://kubernetes.default.svc', namespace: {{ $addon.namespace | quote }}}
  ignoreDifferences:
    - group: apiregistration.k8s.io
      kind: APIService
      managedFieldsManagers: [cert-manager-cainjector]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      managedFieldsManagers: [cert-manager-cainjector]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      managedFieldsManagers: [cert-manager-cainjector]
  {{- if or (eq $name "istiod") (eq $name "istio-base") }}
    # Istiod owns its CA and promotes validation from Ignore to Fail after startup.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: ['.webhooks[]?.clientConfig.caBundle', '.webhooks[]?.failurePolicy']
  {{- end }}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
{{- end }}
{{- end }}
