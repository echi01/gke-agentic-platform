misconfigurations:
  - id: KSV-0053
    paths:
      - kubernetes-mcp-rendered.yaml
      - .artifacts/kubernetes-mcp-rendered.yaml
    expired_at: 2027-01-31
    statement: >-
      Private stdio MCP requires Kubernetes exec into exactly platform-mcp-0.
